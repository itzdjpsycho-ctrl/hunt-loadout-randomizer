# Free hosting. Rooms are temporary and are lost on sleep/restart/redeploy.
services:
  - type: web
    name: hunt-loadout-randomizer
    runtime: docker
    repo: https://github.com/itzdjpsycho-ctrl/hunt-loadout-randomizer
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_DB
        value: /app/runtime/sessions.sqlite3
